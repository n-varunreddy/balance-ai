const sw=(k,l,sub,dis)=>`<label class=ck><input type=checkbox data-a=sw data-v="${k}" ${(sub?S.set.rem[k.split('.')[1]]:S.set[k])?'checked':''} ${dis?'disabled':''}>${l}</label>`;

<h2>Your Data</h2><div class=card><div class=row><button class=btn data-a=ex>Export my data</button><button class="btn o" data-a=dhd>Delete health data</button><button class="btn o" data-a=dall>Delete all data</button></div><p class=mut>Export is a JSON file of everything stored in this browser (videos are not included). Health data covers mood, heart rate, sleep, measurements, habits and stress sessions.</p></div>

function topic(n){return `<h1>${esc(n)}</h1><p class=mut>Beginner ideas. Save one or add it to your planner.</p><button class="btn o" data-a=int data-v="${esc(n)}">${(S.a.ints||[]).includes(n)?'Remove from my interests':'Add to my interests'}</button><div class=grid style="margin-top:10px">${ALL.filter(a=>a.c===n).map(aCard).join('')}</div>`}
const VIEWS={home,fit:fitness,fri:()=>friends(sub),foo:()=>food(sub),hea:()=>health(sub),jr:journals,prog,account:acct,theme:themeV,set:settings};let sub;

const A={go:v=>go(v),pv:v=>{S.pv=v},pd:v=>{const d=new Date(PD+'T12:00');d.setDate(d.getDate()+(+v)*(S.pv==='week'?7:1));PD=dstr(d)},pm:v=>{PM.setMonth(PM.getMonth()+ +v)},pday:v=>{PD=v},
pdone:v=>{const p=S.plan.find(x=>x.i==v);p.st=p.st==='done'?'':'done'},pskip:v=>{const p=S.plan.find(x=>x.i==v);p.st=p.st==='skip'?'':'skip'},pdel:v=>{S.plan=S.plan.filter(x=>x.i!=v)},presch:v=>{const d=prompt('New date (YYYY-MM-DD)',PD);if(d&&/^\d{4}-\d{2}-\d{2}$/.test(d))S.plan.find(x=>x.i==v).d=d},pmv:v=>{const[i,n]=v.split('|'),p=S.plan.find(x=>x.i==i),d=new Date(p.d+'T12:00');d.setDate(d.getDate()+ +n);p.d=dstr(d)},
dis:v=>{S.dis.push(v)},more:v=>{const a=ALL.find(x=>x.n===v);alert(a.n+'\n\n'+a.d+'\n\nSafety: '+a.s)},sva:v=>{S.saved.includes(v)?S.saved=S.saved.filter(x=>x!==v):S.saved.push(v)},svw:v=>A.sva(v),sv:v=>A.sva(v),addp:v=>{addP(v);return 1},
int:v=>{const i=S.a.ints||[];S.a.ints=i.includes(v)?i.filter(x=>x!==v):i.concat(v)},
fedit:()=>{S.fit.done=false},fdel:()=>{if(confirm('Delete fitness data?')){S.fit={};S.workouts=[]}},wk:v=>{S.workouts.push({d:today(),s:v,f:$('#fb').value})},
cp:()=>{navigator.clipboard&&navigator.clipboard.writeText(S.id)},chat:v=>go('fri:'+v),rf:v=>{S.friends=S.friends.filter(x=>x.id!==v)},
ap:()=>{S.diet={v:$('#dt').value,al:$('#al').value.trim()}},mp:v=>{const d=prompt('Which day? (Mon-Sun)','Mon');if(['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].includes(d))(S.meals[d]=S.meals[d]||[]).push(v)},rm:v=>{const[d,i]=v.split('|');S.meals[d].splice(+i,1)},
mmv:v=>{const D=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],[d,i]=v.split('|'),m=S.meals[d].splice(+i,1)[0],n=D[(D.indexOf(d)+1)%7];(S.meals[n]=S.meals[n]||[]).push(m)},
sl:()=>{const set=new Set(S.shop.map(s=>s.n));Object.values(S.meals).flat().forEach(m=>{const r=RE.find(x=>x[0]===m);r&&r[4].forEach(i=>{if(!set.has(i)){set.add(i);S.shop.push({n:i})}})})},ck:(v,e)=>{S.shop[+v].c=e.checked},ad:v=>{S.shop.push({n:v})},
md:v=>{if(S.set.mood)S.moods.push({i:Date.now(),d:today(),m:v})},dm:v=>{S.moods=S.moods.filter(x=>x.i!=v)},dh:v=>{S.hr=S.hr.filter(x=>x.i!=v)},dme:v=>{S.meas=S.meas.filter(x=>x.i!=v)},hab:v=>{const[h,n]=v.split('|');S.habits[h]=Math.max(0,(S.habits[h]||0)+ +n)},
tstart:v=>{const x=STRESS[+v];$('#tmbox').style.display='block';$('#tmn').textContent=x[0];$('#tmi').textContent=x[3];const b=$('#tm');b.dataset.s=$('#m'+v).value*60;b.dataset.n=x[0];startT();return 2},tpause:()=>{TM&&(TM.run=0);return 2},tres:()=>{TM&&(TM.run=1);return 2},treset:()=>{stopT();$('#tm').textContent='Reset';return 2},
rep:(v,e)=>{S.rep[v]=e.checked?1:0},th:v=>{S.theme=v;look()},thsel:(v,e)=>{S.theme=e.value;look()},tsz:(v,e)=>{S.ts=e.value;look()},rmot:(v,e)=>{S.rm=e.checked?'on':'off';look()},
sw:(v,e)=>{v.startsWith('rem.')?S.set.rem[v.slice(4)]=e.checked:S.set[v]=e.checked},
edit:v=>{ED=v},ecan:()=>{ED=null},eclr:v=>{delete S.a[v];ED=null},oskip:()=>{S.ob=true},
ex:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='balance-data.json';a.click();return 2},
dhd:()=>{if(confirm('Delete mood check-ins, heart-rate entries, sleep records, measurements, habits and stress sessions on this device?')){S.moods=[];S.hr=[];S.sleep=[];S.meas=[];S.habits={};S.sess=[]}},
dall:()=>{if(prompt('This deletes everything stored in this browser, including journal videos. Type DELETE to confirm.')==='DELETE'){localStorage.removeItem('balance2');indexedDB.deleteDatabase('bal');alert('All data deleted.');location.reload()}return 2},
recst:async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:true});const ch=[];rec=new MediaRecorder(stream);rec.ondataavailable=e=>ch.push(e.data);rec.onstop=()=>{pend=new Blob(ch,{type:rec.mimeType||'video/webm'});stream.getTracks().forEach(t=>t.stop());const v=$('#pv');v.srcObject=null;v.src=URL.createObjectURL(pend);v.style.display='block';$('#rs').textContent='Preview ready. Save it, or record again.'};rec.start();$('#rs').textContent='Recording... stops at 60 seconds.';setTimeout(()=>rec&&rec.state==='recording'&&rec.stop(),60000)}catch(e){$('#rs').textContent='Camera or microphone is unavailable or permission was denied. You can upload a video or write an entry instead.'}return 2},
recstop:()=>{rec&&rec.state==='recording'&&rec.stop();return 2},disc:()=>{pend=null;const v=$('#pv');v.style.display='none';v.removeAttribute('src');$('#rs').textContent='Recording discarded.';return 2},
dj:v=>{if(confirm('Delete this entry?')){vdel('j'+v);S.jr=S.jr.filter(x=>x.i!=v)}},
pl:async v=>{const b=await vget('j'+v),h=$('#v'+v);if(!b){h.textContent='Video could not be loaded.';return 2}h.innerHTML='<video controls></video>';h.firstChild.src=URL.createObjectURL(b);return 2}};
$('#app').addEventListener('click',async e=>{const d=e.target.closest('[data-a]');if(!d||d.tagName==='INPUT'||d.tagName==='SELECT')return;const f=A[d.dataset.a];if(!f)return;const r=await f(d.dataset.v,d);if(r===2)return;save();if(r!==1)render();else render()});
$('#app').addEventListener('change',e=>{const d=e.target;if(d.id==='pdi'){PD=d.value||PD;save();render();return}if(d.id==='vf'){const f=d.files[0];if(!f)return;if(f.size>5e7){$('#rs').textContent='That file is over 50 MB. Choose a smaller one.';return}pend=f;const v=$('#pv');v.src=URL.createObjectURL(f);v.style.display='block';$('#rs').textContent='Preview ready.';return}const a=d.dataset&&d.dataset.a;if(a&&['ck','rep','sw','thsel','tsz','rmot'].includes(a)){A[a](d.dataset.v,d);save();if(['thsel','rep','ck'].includes(a)&&a!=='ck')render()}});
$('#app').addEventListener('submit',async e=>{e.preventDefault();const f=e.target,v=new FormData(f),id=f.id;
if(id==='pf')S.plan.push({i:Date.now(),d:PD,t:v.get('t'),x:v.get('x').trim(),st:'',p:v.get('p'),n:v.get('n')});
if(id==='ob'||id==='ef'){const ks=id==='ef'?[f.dataset.k]:QS.map(q=>q[0]);ks.forEach(k=>{const q=QS.find(x=>x[0]===k);if(q[2]==='m')S.a[k]=v.getAll(k);else if(q[2]==='ni')S.a[k]={k:v.get(k+'_k'),t:(v.get(k+'_t')||'').trim()};else S.a[k]=(v.get(k)||'').trim()});S.ob=true;ED=null}
if(id==='ff')S.fit={done:true,body:v.getAll('body'),type:v.getAll('type'),exp:v.get('exp'),time:v.get('time'),equip:v.get('equip'),limits:v.get('limits')};
if(id==='af'){const i=v.get('id');if(i===S.id||S.friends.some(x=>x.id===i)){alert('That ID is yours or already saved.');return}S.friends.push({id:i,name:v.get('name')})}
if(id==='mf')(S.msgs[f.dataset.id]=S.msgs[f.dataset.id]||[]).push({t:v.get('t'),ts:Date.now()});
if(id==='shf')S.shop.push({n:v.get('n')});if(id==='hf')S.hr.push({i:Date.now(),d:new Date().toLocaleString(),v:+v.get('bpm')});
if(id==='meF')S.meas.push({i:Date.now(),d:today(),n:v.get('n'),v:+v.get('v')});if(id==='sf')S.sleep.push({d:today(),b:v.get('b'),w:v.get('w'),q:v.get('q')});
if(id==='pnf'){S.a.name=v.get('n').trim()}
if(id==='jf'){const t=(v.get('title')||'').trim(),n=(v.get('notes')||'').trim();if(!t&&!n&&!pend){alert('Add a title, a note or a video first.');return}const i=Date.now();let hv=false;if(pend){hv=await vput('j'+i,pend);if(!hv){alert('The video could not be saved in this browser, so the entry was not saved.');return}}S.jr.push({i,d:today(),title:t,notes:n,v:hv});pend=null}
save();render()});
// Search
const sq=$('#q');let tm;sq.oninput=()=>{clearTimeout(tm);tm=setTimeout(search,150)};
function lev(a,b){if(Math.abs(a.length-b.length)>2)return 9;const d=[];for(let i=0;i<=a.length;i++)d[i]=[i];for(let j=1;j<=b.length;j++)d[0][j]=j;for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[a.length][b.length]}
function search(){const q=sq.value.trim().toLowerCase(),R=$('#res');if(!q){R.style.display='none';return}const I=[];
EX.forEach(x=>I.push({s:'Fitness',t:x[0],x:x[4]+' '+x[2],g:'fit'}));RE.forEach(r=>I.push({s:'Recipe',t:r[0],x:r[4].join(' ')+' '+r[5],g:'foo:rec'}));ALL.forEach(a=>I.push({s:'Activity',t:a.n,x:a.d+' '+a.c,g:'t:'+(ACT[a.c]?a.c:'Sports')}));DIETS.forEach(x=>I.push({s:'Diet plan',t:x[0],x:x[1],g:'foo:diets'}));
S.plan.forEach(p=>I.push({s:'Planner',t:p.x,x:p.d+' '+p.n,g:'home'}));S.shop.forEach(x=>I.push({s:'Shopping list',t:x.n,x:'',g:'foo:plan'}));Object.entries(S.meals).forEach(([d,a])=>a.forEach(m=>I.push({s:'Meal plan '+d,t:m,x:'',g:'foo:plan'})));S.jr.forEach(j=>I.push({s:'Journal',t:j.title||'Entry '+j.d,x:j.notes,g:'jr'}));S.friends.forEach(f=>I.push({s:'Friend',t:f.name,x:f.id,g:'fri'}));S.saved.forEach(n=>I.push({s:'Saved',t:n,x:'',g:'home'}));
if(S.set.hsearch){S.moods.forEach(m=>I.push({s:'Mood check-in',t:m.m,x:m.d,g:'hea'}));S.hr.forEach(h=>I.push({s:'Heart rate',t:h.v+' bpm',x:h.d,g:'hea'}));S.meas.forEach(m=>I.push({s:'Measurement',t:m.n,x:m.v+' '+m.d,g:'hea'}));S.sleep.forEach(s=>I.push({s:'Sleep',t:'Sleep '+s.d,x:s.q,g:'hea'}))}
const W=q.split(/\s+/),out=[];I.forEach(it=>{const h=(it.t+' '+it.x).toLowerCase();if(h.includes(q)){out.push({...it,k:'Exact match',r:2});return}const hw=h.split(/\W+/),hit=W.filter(w=>hw.some(x=>x.startsWith(w)||(w.length>3&&lev(w,x)<=1)));if(hit.length&&hit.length>=Math.ceil(W.length/2))out.push({...it,k:'Partial or similar match',r:1})});out.sort((a,b)=>b.r-a.r);
R.innerHTML=(out.length?out.slice(0,12).map(o=>`<a role=option data-g="${esc(o.g)}"><b>${esc(o.t)}</b> <small>${o.s}, ${o.k}</small><br><small>${esc(o.x.slice(0,90))}</small></a>`).join(''):`<p style="padding:8px" class=mut>No results for “${esc(q)}”. Try fewer words.</p>`)+`<small class=mut style="display:block;padding:6px 10px">Searches this device only (meaning-based search and uploaded document text are not available). Health records ${S.set.hsearch?'included':'excluded'}.</small>`;R.style.display='block'}
$('#res').onclick=e=>{const a=e.target.closest('a');if(a){$('#res').style.display='none';go(a.dataset.g)}};
if(!S.ob)cur='account';render();
